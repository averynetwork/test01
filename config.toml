[log]
# 日志级别: silent, error, warn, info, debug
level = "info"

# 是否使用彩色输出
color = true

# 是否显示时间戳
timestamp = true

# 日志文件路径（可选，不设置则只输出到控制台）
# file = "./logs/brarchive.log"

[archive]
# 需要处理的文件后缀
include_exts = [
    ".json", ".json5", ".ui"
]

# 排除的文件夹
exclude_dirs = [
    "textures", "materials", "texts",
    "sounds"
]

# 特殊处理的文件夹（会递归处理其子目录）
special_folders = [
    "subpacks"
]

# 排除的文件
exclude_files = [
    "ui/_global_variables.json"
]

# 输出文件夹名称
output_dir = "__brarchive"

# 支持的压缩包格式
supported_archives = [
    ".zip", ".7z", ".tar", ".tar.xz", ".tar.gz",
    ".tar.zst", ".tar.bz2", ".tar.lz4", ".mcpack"
]

# 是否删除已处理的文件（处理后删除源文件，并递归删除空文件夹）
remove_processed_files = true

[pack]
# 输出路径
output_path = "./output"

# 是否保留原始压缩包
keep_original = false

# 重名文件的命名模板
# {filename} - 原文件名（不含扩展名）
# {number} - 数字编号
# {ext} - 扩展名
rename_pattern = "{filename} ({number}){ext}"

# 冲突处理方式: "rename" 或 "replace"
on_conflict = "rename"

# 是否删除输入文件（原压缩包），默认 false 不删除
delete_input = false